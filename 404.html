<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Pagina non trovata (404) | Vento in Poppa Charter</title>
  <meta name="description" content="La pagina che cerchi non esiste. Scopri i nostri tour in barca da Sorrento verso Capri, Costiera Amalfitana e Positano." />

  <link rel="canonical" href="https://www.ventoinpoppacharter.com/" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0d3a8f 0%, #164ab9 50%, #0ea5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 720px;
      text-align: center;
    }
    .code {
      font-size: clamp(6rem, 18vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
      opacity: 0.95;
      line-height: 1.6;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .link-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 1.25rem 1rem;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }
    .link-card i { font-size: 1.8rem; }
    .link-card:hover {
      background: rgba(255,255,255,0.22);
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      color: #0d3a8f;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="code" aria-hidden="true">404</div>
    <h1>Pagina non trovata</h1>
    <p>La pagina che stai cercando non esiste o è stata spostata. Esplora invece i nostri tour in barca dalla Penisola Sorrentina.</p>

    <nav aria-label="Link rapidi ai tour" class="links">
      <a class="link-card" href="/tour_capri/" aria-label="Vai al Tour Capri">
        <i class="bi bi-water"></i>
        Tour Capri
      </a>
      <a class="link-card" href="/tour_sunset/" aria-label="Vai al Tour Tramonto">
        <i class="bi bi-sunset"></i>
        Tour Tramonto
      </a>
      <a class="link-card" href="/tour_amalfi/" aria-label="Vai al Tour Costiera Amalfitana">
        <i class="bi bi-tsunami"></i>
        Costiera Amalfitana
      </a>
    </nav>

    <a class="home-btn" href="/" aria-label="Torna alla homepage">
      <i class="bi bi-house-fill"></i>
      Torna alla Homepage
    </a>
  </main>
</body>
</html>
